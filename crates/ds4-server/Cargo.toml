[package]
name = "ds4-server"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "HTTP wire surfaces (Phase 7)"

[lib]
path = "src/lib.rs"

[[bin]]
name = "ds4-server-rs"
path = "src/bin/ds4-server-rs.rs"
required-features = ["native"]

[[bin]]
name = "h3-server-rs"
path = "src/bin/h3-server-rs.rs"

[features]
default = []
native = []

[dependencies]
ds4-core = { path = "../ds4-core" }
ds4-dist = { path = "../ds4-dist" }
ds4-kv = { path = "../ds4-kv" }
ds4-sys = { path = "../ds4-sys" }
serde_json = { version = "1", features = ["arbitrary_precision"] }
sha2 = { version = "0.11", default-features = false }

[dev-dependencies]
ds4-core = { path = "../ds4-core" }
