[package]
name = "ds4-server"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "HTTP wire surfaces (Phase 7)"

[lib]
path = "src/lib.rs"

[[bin]]
name = "ds4-server-rs"
path = "src/bin/ds4-server-rs.rs"
required-features = ["native"]

[[bin]]
name = "h3-server-rs"
path = "src/bin/h3-server-rs.rs"

[[bin]]
name = "gemma4-server-rs"
path = "src/bin/gemma4-server-rs/main.rs"
required-features = ["gemma4-gpu"]

[features]
default = []
native = []
# The Gemma-4 device path: links native/gemma4/gemma4_gpu.o, which the
# Makefile's gemma4-server target compiles and passes to rustc.
gemma4-gpu = []

[dependencies]
ds4-core = { path = "../ds4-core" }
ds4-dist = { path = "../ds4-dist" }
ds4-kv = { path = "../ds4-kv" }
ds4-sys = { path = "../ds4-sys" }
serde_json = { version = "1", features = ["arbitrary_precision"] }
sha2 = { version = "0.11", default-features = false }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
ds4-core = { path = "../ds4-core" }
