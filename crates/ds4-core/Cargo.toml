[package]
name = "ds4-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Safe host wrappers around ds4-sys plus GGUF shape catalog"

[lib]
path = "src/lib.rs"

[dependencies]
ds4-sys = { path = "../ds4-sys" }
serde_json = { version = "1", features = ["float_roundtrip"] }
regex = "1"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
rustfft = "6.4.1"
hound = "3.5.1"
hf-chat-template = { version = "=1.0.0", default-features = false, features = ["pycompat", "strftime"] }
