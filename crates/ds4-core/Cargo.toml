[package]
name = "ds4-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Safe host wrappers around ds4-sys plus GGUF shape catalog"

[lib]
path = "src/lib.rs"

# The h3 gates are on-demand device checks: each one calls `h3t_*`/`h3d_*`
# entry points that live in `native/h3/*.o`, which only the `tests/h3-*` make
# targets link (Makefile:446-475). A plain `cargo test`, `cargo check
# --all-targets` or `cargo clippy --all-targets` builds every example, so
# without the gate these five fail at link time on a model-free runner
# (PR 111, Host parity run 40127087166). The feature is additive and empty:
# it exists only to keep those targets out of the default build.
[features]
h3-gates = []

[[example]]
name = "h3_text_gate"
required-features = ["h3-gates"]

[[example]]
name = "h3_dit_gate"
required-features = ["h3-gates"]

[[example]]
name = "h3_vision_gate"
required-features = ["h3-gates"]

[[example]]
name = "h3_multimodal_gate"
required-features = ["h3-gates"]

[[example]]
name = "h3_video_encoder_gate"
required-features = ["h3-gates"]

[[example]]
name = "h3_audio_encoder_gate"
required-features = ["h3-gates"]

[[example]]
name = "h3_device_gate"
required-features = ["h3-gates"]

[dependencies]
ds4-sys = { path = "../ds4-sys" }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = { version = "0.11", default-features = false }
regex = "1"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
rustfft = "6.4.1"
hound = "3.5.1"
hf-chat-template = { version = "=1.0.0", default-features = false, features = ["pycompat", "strftime"] }
unicode-normalization = "0.1"

[target.'cfg(target_os = "linux")'.dependencies]
libloading = "=0.8.9"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[[example]]
name = "h3_partition_gate"
required-features = ["h3-gates"]

[[example]]
name = "h3_canvas_gate"
required-features = ["h3-gates"]

[[example]]
name = "h3_reference_gate"
required-features = ["h3-gates"]

# P12.5: the reference test suite, one target per file in
# `/data/h3.c/tests`. Sources live under `tests/h3/` at the repository root and
# carry the reference file's own name, so `make tests/h3-<name>` builds and runs
# the port's counterpart. On-demand only (P12.5 rule 2): nothing in CI, no hook,
# no push depends on them, and the empty `h3-gates` feature keeps them out of
# every default build (`cargo test`, `cargo clippy --all-targets`).
[[example]]
name = "test_host_portable"
path = "../../tests/h3/test_host_portable.rs"
required-features = ["h3-gates"]

[[example]]
name = "test_tokenizer_portable"
path = "../../tests/h3/test_tokenizer_portable.rs"
required-features = ["h3-gates"]

[[example]]
name = "test_av_mux"
path = "../../tests/h3/test_av_mux.rs"
required-features = ["h3-gates"]
