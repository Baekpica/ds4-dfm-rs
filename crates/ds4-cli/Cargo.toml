[package]
name = "ds4-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "CLI / bench host (shadow binaries in Phase 3)"

[lib]
path = "src/lib.rs"

[[bin]]
name = "ds4-rs"
path = "src/bin/ds4-rs.rs"
required-features = ["native"]

[[bin]]
name = "ds4-bench-rs"
path = "src/bin/ds4-bench-rs.rs"
required-features = ["native"]

[[bin]]
name = "ds4-agent-rs"
path = "src/bin/ds4-agent-rs.rs"
required-features = ["native"]

[features]
default = []
native = []
perf-nvtx = ["dep:nvtx"]

[dependencies]
ds4-core = { path = "../ds4-core" }
ds4-dist = { path = "../ds4-dist" }
ds4-kv = { path = "../ds4-kv" }
ds4-web = { path = "../ds4-web" }
ds4-server = { path = "../ds4-server" }
serde_json = "1"
libc = "0.2"
nvtx = { version = "2", optional = true, default-features = false, features = ["std"] }
