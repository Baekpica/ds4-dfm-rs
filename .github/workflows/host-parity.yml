name: Host parity

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: host-parity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy
      - name: Install media tools
        # Bounded, and lean on purpose. Run 40229947520 spent 26 of the job's
        # 30 minutes inside this step: apt was still fetching the optional
        # set (pocketsphinx-en-us 27.4 MB, the VA-API/VDPAU/Mesa drivers,
        # libaacs0, libbdplus0, librsvg2-common) when the job was cancelled.
        # The tests need ffmpeg and ffprobe for file and frame work only, all
        # of which comes from ffmpeg's own library dependency set, so the
        # optional drivers are dropped and the fetches are time-boxed.
        timeout-minutes: 12
        run: |
          sudo env DEBIAN_FRONTEND=noninteractive apt-get update \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y \
            --no-install-recommends \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 \
            ffmpeg
          ffmpeg -version | head -1
          ffprobe -version | head -1
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked
      - name: C and Rust host parity
        run: |
          make test-kv-parity
          make test-web-parity
          make test-dist-parity
          make test-server-parity
          make test-catalog-parity
          make test-tokenizer-parity
          make test-session-parity
          make test-agent-parity
      - name: Serialized workspace tests
        run: cargo test --workspace --locked -- --test-threads=1
      - name: Model-free V41 lifecycle and state
        run: |
          make test-model-registration test-vq-source-release test-ds41-bridge-lifetime \
            test-ds41-kv-import test-ds41-moe-fork test-ds41-gr-forward \
            test-ds41-boundary test-ds41-history test-ds41-trace \
            test-ds41-kv-rows test-ds41-rollback test-ds41-vision-gate
      - name: IQuest evidence comparator
        run: cargo test -p ds4-cli --example iquest_perf_verify --features native --locked
      - name: PLE storage formats
        run: make test-ple-formats
      - name: GLM bank fallback
        run: make test-glm53-fit
      - name: Bank speculative finish
        run: make test-family-cont-spec-finish
      - name: Bonsai CPU reference
        run: make pq2-0-test test-qwen35-ref
      - name: All host targets
        run: cargo check --workspace --all-targets --locked
      # `native` is off by default, so the production host is otherwise
      # never type-checked here. Linking still needs the CUDA objects.
      - name: Native serving host
        run: cargo check -p ds4-server --lib --bin ds4-server-rs --features native --locked
