name: Host parity

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: host-parity-${{ github.ref }}
  cancel-in-progress: true

# One job per Makefile `ci-*` group; add checks to the groups, not here.
jobs:
  ci:
    name: ${{ matrix.group }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        group: [ci-lint, ci-rust, ci-parity, ci-model-free]
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy
      - name: Install host test dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg python3-numpy
      - name: Run ${{ matrix.group }}
        run: make ${{ matrix.group }}
